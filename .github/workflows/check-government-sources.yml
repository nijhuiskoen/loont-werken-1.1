name: Check official government sources

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check official sources
        id: sourcecheck
        continue-on-error: true
        run: npm run check:sources

      - name: Commit source monitor state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .source-monitor/state.json
          git diff --cached --quiet || git commit -m "chore: update government source monitor state"
          git push || true

      - name: Open issue when a source changed
        if: steps.sourcecheck.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "⚠️ Officiële bron gewijzigd – fiscale data controleren" \
            --body "De dagelijkse broncontrole van Loont-werken heeft een wijziging of fout gedetecteerd. Controleer de officiële bronpagina's en beoordeel of de versiegebonden parameters in src/data moeten worden aangepast. Dit systeem wijzigt fiscale parameters NIET automatisch." || true
